[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-strategy-lab-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=6,<7", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=poker_lab --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.setuptools.package-data]
poker_lab = ["data/*.json", "data/*.json.gz"]
