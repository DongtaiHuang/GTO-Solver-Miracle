name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_DB: test
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:ci-only@localhost:5432/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: ruff check .
      - run: mypy
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail http://localhost:8000/health && curl --fail http://localhost:3000
      - if: always()
        run: docker compose down

  account-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yaml:compose.accounts.yaml
      COMPOSE_PROJECT_NAME: miracle-account-smoke
      COMPOSE_PARALLEL_LIMIT: "1"
      ALLOWED_HOSTS: backend,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable database
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://miracle:$password@db:5432/miracle" >> "$GITHUB_ENV"
      - run: docker compose config --quiet && docker compose build && docker compose up -d --wait --wait-timeout 180
      - name: Verify migration, account connectivity and restart persistence
        run: |
          set -euo pipefail
          sql() { docker compose exec -T db psql -XAt -v ON_ERROR_STOP=1 -U miracle -d miracle -c "$1"; }
          test "$(sql 'SELECT version_num FROM alembic_version')" = 001_accounts
          curl -fsS http://localhost:8000/ready
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://localhost:3000/account >/dev/null
          curl -fsS http://localhost:3000/api/profiles >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/account/me)" = 401
          sql "INSERT INTO members(id,issuer,subject,display_name) VALUES(gen_random_uuid(),'ci','restart','CI')"
          docker compose stop backend db
          docker compose up -d --wait --wait-timeout 180
          test "$(sql "SELECT count(*) FROM members WHERE issuer='ci' AND subject='restart'")" = 1
          curl -fsS http://localhost:8000/ready
      - if: always()
        run: docker compose down --volumes --remove-orphans
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -e './backend[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './backend[dev]' scipy==1.15.3 numpy==2.4.6
      - run: python -m pytest -q tools
