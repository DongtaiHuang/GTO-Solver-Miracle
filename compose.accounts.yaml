services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: miracle
      POSTGRES_USER: miracle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["miracle_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miracle -d miracle"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: ["alembic","upgrade","head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  miracle_pg:
