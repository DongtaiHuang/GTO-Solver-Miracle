services:
  db:
    image: postgres:16
    restart: unless-stopped
    networks: [storage]
    environment:
      POSTGRES_DB: miracle
      POSTGRES_USER: miracle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["miracle_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miracle -d miracle"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    networks: [storage]
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: ["alembic","upgrade","head"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/account', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  backend:
    networks: [default, storage]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
networks:
  storage:
    internal: true
volumes:
  miracle_pg:
